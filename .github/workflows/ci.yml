name: Roku TV App CI / Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck & Linter
        run: npm run lint

      - name: Run Unit & E2E Test Suite
        run: npm run test

      - name: Run Official Roku Channel Automated Testing Suite
        run: npm run test:roku

      - name: Verify Roku Channel Packaging
        run: npm run package:roku

      - name: Verify Web Simulator Build
        run: npm run build
